[[annotations]]
path = ["latex/hyphenation/hyph-cs.*.txt", "latex/hyphenation/hyph-sk.*.txt", "latex/hyphenation/hyph-lv.*.txt"]
precedence = "override"
SPDX-FileCopyrightText = "The hyph-utf8 authors, see latex/hyphenation/NOTICES.txt"
SPDX-License-Identifier = "GPL-2.0-or-later"

[[annotations]]
path = ["latex/hyphenation/hyph-id.*.txt", "latex/hyphenation/hyph-hu.*.txt"]
precedence = "override"
SPDX-FileCopyrightText = "The hyph-utf8 authors, see latex/hyphenation/NOTICES.txt"
SPDX-License-Identifier = "GPL-2.0-only"

[[annotations]]
path = ["latex/hyphenation/hyph-pt.*.txt"]
precedence = "override"
SPDX-FileCopyrightText = "The hyph-utf8 authors, see latex/hyphenation/NOTICES.txt"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
