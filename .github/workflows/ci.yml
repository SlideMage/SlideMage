name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  latex-linux:
    name: LaTeX (Linux, TeX Live)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: sudo apt-get update && sudo apt-get install -y texlive-full biber latexmk
      - name: Compile demo decks
        working-directory: example/decks
        run: |
          latexmk test.tex
          latexmk test-student.tex

  # Windows users compile with MiKTeX. Allowed to fail until it has passed
  # once: MiKTeX's TEXINPUTS handling (see example/.latexmkrc) hasn't been
  # verified on a real Windows machine since the latex/ + example/ split.
  latex-windows:
    name: LaTeX (Windows, MiKTeX)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install MiKTeX
        run: |
          choco install miktex --no-progress -y
          "C:\Program Files\MiKTeX\miktex\bin\x64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Allow on-the-fly package installs
        run: |
          initexmf --admin --set-config-value=[MPM]AutoInstall=1
          miktex --admin packages update-package-database
      - name: Compile demo decks
        working-directory: example/decks
        run: |
          latexmk test.tex
          latexmk test-student.tex
