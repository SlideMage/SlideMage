# SlideMage's own TeX needs: what the framework (latex/) and the example project need from the TeX distribution.
#
# One list for everything that installs or checks TeX: packaging/install-slidemage.sh (apt and dnf),
# packaging/slidemage.iss (MiKTeX), and later the app's own check (task plugin-requirements in the handover), which
# reads the same keys as a package's needs_tex / needs_programs. packaging/tex_requirements.py writes the lists into
# the installers (between their "generated by packaging/tex_requirements.py" markers); tests/test_tex_requirements.py
# fails while they differ from this file. After editing this file: python packaging/tex_requirements.py
#
# Each [[tex]] entry: `file`, one file of the package, found with kpsewhich on every distribution; `ctan`, the
# package's name in MiKTeX and in TeX Live's tlmgr; `debian` and `fedora`, the distribution package that ships the
# file (apt-file search and dnf provides 'tex(<file>)', 2026-11-27, Ubuntu 24.04 and Fedora 43); `miktex` only where
# MiKTeX's name differs from ctan. `optional = true`: installed where it is cheap, never a failure (beamer uses
# sansmathaccent when it is there; Debian has it only in the 1 GB texlive-fonts-extra).
#
# Not listed: what every LuaLaTeX installation has (the LaTeX kernel, l3kernel, graphics, tools, amsmath, ...), and
# Fira, which the framework brings itself (latex/fonts/fira/). Inventory: the .fls files of
# `slidemage --self-test --compile` and of the example project's decks.

# Programs, found on PATH. Perl is latexmk's: the distributions' latexmk package depends on it; on Windows the setup
# installs Strawberry Perl when neither it nor Git for Windows' perl is there.
programs = [
    { name = "lualatex", ctan = "luatex", debian = "texlive-latex-base", fedora = "texlive-luahbtex" },
    { name = "latexmk", ctan = "latexmk", debian = "latexmk", fedora = "latexmk" },
    { name = "biber", ctan = "biber", miktex = "biber-windows-x64", debian = "biber", fedora = "biber" },
    { name = "kpsewhich", ctan = "kpathsea", debian = "texlive-binaries", fedora = "texlive-kpathsea" },
]

