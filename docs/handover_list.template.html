<title>Handover Next Tasks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style id="css">
/* Layout: one narrow column of compact task cards (grip, checkbox, title, source tag, arrows); under each, Details and Modify toggles, the run choice (Subsession or Subagent, model, effort), and a fixed bar with Update and Start tasks. */
:root{--bg:#f6f7f9;--fg:#1b2430;--muted:#5d6877;--card:#ffffff;--line:#d9dee6;--accent:#1f5fbf;--on-accent:#ffffff;--ok:#1d7a4d;--font-ui:"IBM Plex Sans",system-ui,sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171e;--fg:#e4e9f0;--muted:#98a3b3;--card:#1a212b;--line:#2c3644;--accent:#6fa3f0;--on-accent:#0d1520;--ok:#5cc58f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171e;--fg:#e4e9f0;--muted:#98a3b3;--card:#1a212b;--line:#2c3644;--accent:#6fa3f0;--on-accent:#0d1520;--ok:#5cc58f;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.5;padding-block:24px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:760px;margin:0 auto}
h1{font-size:26px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 20px}
.task{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:8px;display:grid;gap:8px}
.task.on{border-color:var(--accent)}
.row{display:flex;gap:12px;align-items:flex-start}
.row input[type=checkbox]{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--accent)}
.row label{flex:1;min-width:0;cursor:pointer}
.t{font-weight:600}
.d{color:var(--muted);font-size:14px;margin-top:2px}
.tag{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:4px}
textarea{width:100%;box-sizing:border-box;min-height:56px;resize:vertical;font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px}
textarea.dirty{border-color:var(--accent)}
textarea:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;justify-content:space-between}
.bar span{color:var(--muted);font-size:14px}
.btns{display:flex;gap:8px}
button{font:inherit;font-weight:600;background:var(--accent);color:var(--on-accent);border:0;border-radius:4px;padding:10px 18px;cursor:pointer}
button.sec{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
.note{background:var(--card);border:1px solid var(--ok);border-radius:6px;padding:12px 14px;margin-bottom:12px;color:var(--fg)}
.note b{color:var(--ok)}
.grip{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;width:26px;color:var(--muted);cursor:grab;user-select:none;font-size:16px;line-height:1;padding-top:1px}
.grip .rk{font-family:var(--font-mono);font-size:11px}
.task.drag{opacity:.4}
.task.over{border-color:var(--accent);border-style:dashed}
.mv{display:flex;flex-direction:column;gap:2px;flex:none}
button.mb{background:transparent;color:var(--muted);border:1px solid var(--line);padding:0;width:26px;height:20px;font-size:10px;font-weight:400;border-radius:3px}
button.mb:hover{color:var(--accent);border-color:var(--accent)}
.opts{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding-left:38px;font-size:13px}
button.lnk{background:none;border:0;color:var(--accent);padding:0;font-size:13px;font-weight:600;cursor:pointer}
.opts label.ck{display:flex;gap:6px;align-items:center;cursor:pointer;color:var(--fg)}
.opts input[type=checkbox]{accent-color:var(--accent)}
.opts select{font:inherit;font-size:13px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:3px 6px}
.dot{color:var(--accent)}
.pad{padding-left:38px}
pre.det{margin:0;max-height:340px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-family:var(--font-mono);font-size:12px;line-height:1.5;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px}
</style>
<div id="app"></div>
<script id="appjs">
const STATE = /*S*/__STATE__/*E*/;
STATE.open = STATE.open || {};
STATE.mod = STATE.mod || {};
STATE.run = STATE.run || {};
const MODELS=[["sonnet","Sonnet"],["opus","Opus"],["haiku","Haiku"],["fable","Fable"]];
const EFFORTS=[["low","Low"],["medium","Medium"],["high","High"],["xhigh","Extra high"],["max","Max"]];
const $=(s,r=document)=>r.querySelector(s);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function changed(){return STATE.tasks.filter(t=>(STATE.notes[t.id]||"")!==(STATE.savedNotes[t.id]||"")).map(t=>t.id)}
function zone(t){return t.pin==="top"?0:t.pin==="bottom"?2:1}
function pinsChanged(){STATE.savedPin=STATE.savedPin||{};return STATE.tasks.filter(t=>(t.pin||"")!==(STATE.savedPin[t.id]||"")).map(t=>t.id)}
function pinWord(t){return t.pin==="top"?"pin top":t.pin==="bottom"?"pin bottom":"unpinned"}
function pinLines(ids){return ids.map(id=>"- "+title(id)+" ["+id+"]: "+pinWord(STATE.tasks.find(t=>t.id===id))).join("\n")}
const PINMSG="Set the `pin` field of each of these tasks' lines in the TASKS block of docs/handover.md to \"top\" or \"bottom\" as given, or remove the field for unpinned (pinned tasks stay at the top or bottom of the picker, new tasks land between them):\n";
function statusText(){const n=Object.keys(STATE.sel).filter(k=>STATE.sel[k]).length,a=changed().length,b=pinsChanged().length;return n+" selected"+(a?", "+a+" changed note(s)":"")+(b?", "+b+" changed pin(s)":"")}
function pinMap(){const m={};STATE.tasks.forEach(t=>{if(t.pin)m[t.id]=t.pin});return m}
function setPin(id,v){const i=STATE.tasks.findIndex(t=>t.id===id);if(i<0)return;const[t]=STATE.tasks.splice(i,1);const was=t.pin||"";if(v)t.pin=v;else delete t.pin;
  let at;if(v==="top")at=STATE.tasks.filter(x=>zone(x)===0).length;else if(v==="bottom")at=STATE.tasks.length-STATE.tasks.filter(x=>zone(x)===2).length;
  else if(was==="top")at=STATE.tasks.filter(x=>zone(x)===0).length;else at=STATE.tasks.length-STATE.tasks.filter(x=>zone(x)===2).length;
  STATE.tasks.splice(at,0,t);render()}
function title(id){return STATE.tasks.find(t=>t.id===id).title}
function run(id){return STATE.run[id]||(STATE.run[id]={mode:"",model:"sonnet",effort:"medium"})}
function runText(id){const r=run(id);return r.mode?" ("+(r.mode==="session"?"subsession":"subagent")+", "+r.model+", "+r.effort+")":""}
function opts(list,cur){return list.map(o=>'<option value="'+o[0]+'"'+(o[0]===cur?' selected':'')+'>'+o[1]+'</option>').join("")}
function render(){
  const app=$("#app");let h='<h1>Handover Next Tasks</h1><p class="sub">Tick what to start, and drag the handle (or use the arrows) to set the order: ticked tasks are started top to bottom. Use Modify to write notes for a task and Update to send them without starting anything. Source: SlideMage/docs/handover.md.</p>';
  if(STATE.updated){h+='<div class="note"><b>Update sent</b> for '+STATE.updated.ids.length+' task(s)'+(STATE.updated.wake?', and Claude was notified.':'. Claude could not be notified automatically: tell the session in chat that you sent an update.')+'</div>'}
  if(STATE.sent){h+='<div class="note"><b>Sent.</b> '+STATE.sent.ids.length+' task(s) handed to Claude'+(STATE.sent.wake?', and Claude was notified.':'. Claude could not be notified automatically: tell the session in chat that you sent the picks.')+' Pick again and resend to change it.</div>'}
  const dirty=changed(),pch=pinsChanged();
  STATE.tasks.forEach((t,i)=>{
    const on=!!STATE.sel[t.id],open=!!STATE.open[t.id],mod=!!STATE.mod[t.id],dn=dirty.indexOf(t.id)>=0,hasNote=!!(STATE.notes[t.id]||"").trim(),r=run(t.id);
    h+='<div class="task'+(on?' on':'')+'" data-card="'+t.id+'"><div class="row"><div class="grip" draggable="true" data-grip="'+t.id+'" title="Drag to reorder">⋮⋮<span class="rk">'+(i+1)+'</span></div><input type="checkbox" id="c-'+t.id+'" data-id="'+t.id+'"'+(on?' checked':'')+'><label for="c-'+t.id+'"><div class="t">'+esc(t.title)+'</div><div class="d">'+esc(t.desc)+'</div><div class="tag">'+esc(t.grp+' · '+t.src+(t.pin?' · pinned '+t.pin:''))+'</div></label><div class="mv"><button class="mb" data-m="'+t.id+'" data-d="-1" aria-label="Move up">▲</button><button class="mb" data-m="'+t.id+'" data-d="1" aria-label="Move down">▼</button></div></div>';
    h+='<div class="opts"><button class="lnk" data-det="'+t.id+'" aria-expanded="'+open+'">'+(open?'Hide details':'Details')+'</button><button class="lnk" data-mod="'+t.id+'" aria-expanded="'+mod+'">'+(mod?'Hide modify':'Modify')+(hasNote&&!mod?' <span class="dot" title="Has a note">●</span>':'')+'</button><button class="lnk" data-pin="'+t.id+'" data-v="top" aria-pressed="'+(t.pin==="top")+'">'+(t.pin==="top"?'Unpin top':'Pin top')+'</button><button class="lnk" data-pin="'+t.id+'" data-v="bottom" aria-pressed="'+(t.pin==="bottom")+'">'+(t.pin==="bottom"?'Unpin bottom':'Pin bottom')+'</button>';
    if(r.mode!=="agent")h+='<label class="ck"><input type="checkbox" data-mode="session" data-rid="'+t.id+'"'+(r.mode==="session"?' checked':'')+'>Subsession</label>';
    if(r.mode!=="session")h+='<label class="ck"><input type="checkbox" data-mode="agent" data-rid="'+t.id+'"'+(r.mode==="agent"?' checked':'')+'>Subagent</label>';
    if(r.mode)h+='<label class="ck">Model <select data-run="model" data-rid="'+t.id+'" aria-label="Model for '+esc(t.title)+'">'+opts(MODELS,r.model)+'</select></label><label class="ck">Effort <select data-run="effort" data-rid="'+t.id+'" aria-label="Effort for '+esc(t.title)+'">'+opts(EFFORTS,r.effort)+'</select></label>';
    h+='</div>';
    if(open)h+='<pre class="det">'+(t.detail?esc(t.detail):'No details in handover.md for this task.')+'</pre>';
    if(mod)h+='<textarea id="n-'+t.id+'" class="'+(dn?'dirty':'')+'" data-note="'+t.id+'" aria-label="Notes for '+esc(t.title)+'" placeholder="Notes or clarifications for this task (optional)">'+esc(STATE.notes[t.id]||"")+'</textarea>';
    h+='</div>';
  });
  const n=Object.keys(STATE.sel).filter(k=>STATE.sel[k]).length;
  h+='<div class="bar"><span id="cnt">'+statusText()+'</span><div class="btns"><button id="upd" class="sec"'+(dirty.length||pch.length?'':' disabled')+'>Update</button><button id="cp" class="sec"'+(n?'':' disabled')+' title="Copy the picks as text to paste into the chat if Start tasks does not wake Claude">Copy picks</button><button id="go"'+(n?'':' disabled')+'>Start tasks</button></div></div>';
  app.innerHTML=h;
}
document.addEventListener("change",e=>{
  const t=e.target,d=t.dataset||{};
  if(d.id){STATE.sel[d.id]=t.checked;if(!t.checked)delete STATE.sel[d.id];render()}
  else if(d.mode){const r=run(d.rid);r.mode=t.checked?d.mode:"";render()}
  else if(d.run){run(d.rid)[d.run]=t.value}
});
document.addEventListener("input",e=>{const id=e.target.dataset&&e.target.dataset.note;if(id){STATE.notes[id]=e.target.value;const d=changed(),u=$("#upd"),c=$("#cnt");if(u)u.disabled=!(d.length||pinsChanged().length);e.target.classList.toggle("dirty",d.indexOf(id)>=0);if(c)c.textContent=statusText()}});
const RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
function noteLines(ids){return ids.map(id=>"- "+title(id)+" ["+id+"]: "+((STATE.notes[id]||"").trim()||"(note cleared)")).join("\n")}
function clip(msg){return new TextEncoder().encode(msg).length>3900?msg.slice(0,1500)+"\n... (cut; read the page's STATE for the rest)":msg}
/* Republishing wakes nobody, so also send the text to Claude as a comment (editors only; the viewer may be asked once). */
async function wake(btn,msg){
  try{
    const cm=await claude.use("comments");
    if(cm&&cm.sendToClaude&&(await cm.canSendToClaude())==="available"){
      await cm.sendToClaude({anchor:await cm.anchorFor(btn),text:clip(msg)});
      return true;
    }
  }catch(err){}
  return false;
}
async function save(btn,ns){
  const art=await claude.use("artifact");
  if(!art){btn.textContent="Unavailable here";return}
  const css=$("#css").textContent,js=$("#appjs").textContent;
  const a=js.indexOf("/*S*/"),b=js.indexOf("/*E*/");
  const newjs=js.slice(0,a)+"/*S*/"+JSON.stringify(ns)+js.slice(b);
  const head='<title>Handover Next Tasks</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<style id="css">'+css+'</style>\n<div id="app"></div>\n<script id="appjs">'+newjs+'<\/script>';
  const doc='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+head+'</body></html>';
  try{await art.publish(doc)}catch(err){btn.disabled=false;btn.textContent=(err&&err.code==="conflict")?"Reloaded, try again":"Could not send"}
}
function startMsg(ids){
  const ch=changed().filter(id=>ids.indexOf(id)<0);
  let msg="Start these tasks now, in this order (the full picks, with the run choice for each, are also in this page's STATE.sent). A subsession or subagent choice is the user's instruction: use that mode, model and effort. Integrate each note into its task's description in handover.md (desc and marked text), then clear the task's `notes` field.\n"+ids.map((id,i)=>(i+1)+". "+title(id)+" ["+id+"]"+runText(id)+((STATE.notes[id]||"").trim()?" - note: "+STATE.notes[id].trim():"")).join("\n");
  if(ch.length)msg+="\n\nAlso integrate these notes into those tasks' descriptions, as for an update (do not start these tasks):\n"+noteLines(ch);
  const pc0=pinsChanged();if(pc0.length)msg+="\n\nAlso, pin changes (do not start these tasks): "+PINMSG+pinLines(pc0);
  return msg}
document.addEventListener("click",async e=>{
  const btn=e.target;
  if(btn.id==="cp"){
    const ids=STATE.tasks.filter(t=>STATE.sel[t.id]).map(t=>t.id);if(!ids.length)return;
    const msg="/handover picks:\n"+startMsg(ids);
    let ok=false;try{await navigator.clipboard.writeText(msg);ok=true}catch(_){}
    if(!ok){const ta=document.createElement("textarea");ta.value=msg;ta.style.cssText="position:fixed;left:0;top:0;width:90%;height:8em;z-index:9";document.body.appendChild(ta);ta.select();try{ok=document.execCommand("copy")}catch(_){}if(ok)ta.remove()}
    btn.textContent=ok?"Copied. Paste into the chat":"Copy failed: copy the text shown";setTimeout(()=>{btn.textContent="Copy picks"},4000);return}
  if(btn.id==="go"){
    const ids=STATE.tasks.filter(t=>STATE.sel[t.id]).map(t=>t.id);if(!ids.length)return;
    btn.disabled=true;btn.textContent="Sending…";
    const ch=changed().filter(id=>ids.indexOf(id)<0);
    const msg=startMsg(ids);
    const wk=await wake(btn,msg);
    const ns=JSON.parse(JSON.stringify(STATE));
    ns.sent={ids:ids,wake:wk,at:new Date().toISOString(),picked:ids.map(id=>({rank:STATE.tasks.findIndex(t=>t.id===id)+1,id:id,task:title(id),note:STATE.notes[id]||"",run:JSON.parse(JSON.stringify(run(id)))}))};
    ns.savedNotes=JSON.parse(JSON.stringify(STATE.notes));
    ns.savedPin=pinMap();
    await save(btn,ns);
  }else if(btn.id==="upd"){
    const ids=changed(),pids=pinsChanged();if(!ids.length&&!pids.length)return;
    btn.disabled=true;btn.textContent="Sending…";
    let msg="UPDATE ONLY, do not start any task."+(ids.length?" Integrate each note into that task's description: rewrite its `desc` in the TASKS block of docs/handover.md and its text between its task markers, so the note is not kept separately, then clear the task's `notes` field and reply with one line:\n"+noteLines(ids):"");
    if(pids.length)msg+=(ids.length?"\n\n":" ")+PINMSG+pinLines(pids);
    const wk=await wake(btn,msg);
    const ns=JSON.parse(JSON.stringify(STATE));
    ns.updated={ids:ids.concat(pids.filter(i=>ids.indexOf(i)<0)),wake:wk,at:new Date().toISOString()};
    ns.savedNotes=JSON.parse(JSON.stringify(STATE.notes));
    ns.savedPin=pinMap();
    await save(btn,ns);
  }
});
function moveTo(id,j){const i=STATE.tasks.findIndex(t=>t.id===id);if(i<0)return;const z=zone(STATE.tasks[i]),idx=STATE.tasks.map((t,k)=>zone(t)===z?k:-1).filter(k=>k>=0);j=Math.max(idx[0],Math.min(idx[idx.length-1],j));if(i===j)return;const[t]=STATE.tasks.splice(i,1);STATE.tasks.splice(j,0,t);render()}
let dragId=null;
document.addEventListener("dragstart",e=>{const g=e.target.closest&&e.target.closest("[data-grip]");if(!g)return;dragId=g.dataset.grip;e.dataTransfer.setData("text/plain",dragId);e.dataTransfer.effectAllowed="move";const c=g.closest(".task");if(c)setTimeout(()=>c.classList.add("drag"),0)});
document.addEventListener("dragover",e=>{if(!dragId)return;const c=e.target.closest(".task");if(!c)return;e.preventDefault();document.querySelectorAll(".task.over").forEach(x=>x.classList.remove("over"));c.classList.add("over")});
document.addEventListener("drop",e=>{if(!dragId)return;const c=e.target.closest(".task");if(!c)return;e.preventDefault();const to=STATE.tasks.findIndex(t=>t.id===c.dataset.card);const id=dragId;dragId=null;moveTo(id,to)});
document.addEventListener("dragend",()=>{dragId=null;document.querySelectorAll(".task.drag,.task.over").forEach(x=>x.classList.remove("drag","over"))});
document.addEventListener("click",e=>{
  const d=e.target.closest&&e.target.closest("[data-det]");
  if(d){const id=d.dataset.det;STATE.open[id]=!STATE.open[id];render();return}
  const pb=e.target.closest&&e.target.closest("[data-pin]");
  if(pb){const id=pb.dataset.pin,v=pb.dataset.v,t=STATE.tasks.find(x=>x.id===id);setPin(id,t&&t.pin===v?"":v);return}
  const m=e.target.closest&&e.target.closest("[data-mod]");
  if(m){const id=m.dataset.mod;STATE.mod[id]=!STATE.mod[id];render();if(STATE.mod[id]){const ta=$('[data-note="'+id+'"]');if(ta)ta.focus()}return}
  const b=e.target.closest&&e.target.closest("[data-m]");if(!b)return;
  const id=b.dataset.m;const i=STATE.tasks.findIndex(t=>t.id===id);moveTo(id,i+Number(b.dataset.d));
  const nb=document.querySelector('[data-m="'+id+'"][data-d="'+b.dataset.d+'"]');if(nb)nb.focus()
});
render();
</script>
