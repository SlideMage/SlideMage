name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The GPL/AGPL/LGPL terms of the executable: whoever gets it can get the complete corresponding source of the
  # same release (THIRD_PARTY_NOTICES.md says so).
  source:
    name: Source archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive
        shell: bash
        run: |
          mkdir -p out
          git archive --format=tar.gz --prefix="SlideMage-${GITHUB_REF_NAME}/" -o "out/SlideMage-${GITHUB_REF_NAME}-source.tar.gz" HEAD
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/SlideMage-${{ github.ref_name }}-source.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: false

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: SlideMage-linux
            binary_path: dist/SlideMage
          - os: windows-latest
            asset_name: SlideMage-windows
            binary_path: dist/SlideMage.exe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # release_notes.py needs the previous tag
      # Info -> "Check for updates…" compares the release tag with the
      # running build's VERSION_NUMBER, so the two must be the same.
      - name: Tag matches VERSION_NUMBER
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected=$(sed -n 's/^VERSION_NUMBER = "\(v[^"]*\)".*/\1/p' src/slidemage/version.py)
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match VERSION_NUMBER $expected"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: pip install -e ".[build]"
      # The release notes are this version's history entry in version.py.
      # Fails the release when the major number goes up without a
      # "BREAKING:" paragraph there -- the updater relies on that marker to
      # ask before installing a release that breaks with the past.
      - name: Release notes
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            tag=$(sed -n 's/^VERSION_NUMBER = "\(v[^"]*\)".*/\1/p' src/slidemage/version.py)
          fi
          python packaging/release_notes.py "$tag" > release_notes.md
      # The folder first: it is what installations update to (the updater of a folder installation fetches
      # SlideMage-<os>-folder.zip), so it is built, tested and published before the single file is built.
      - name: Build the folder
        env:
          SLIDEMAGE_BUILD: folder
        run: pyinstaller --noconfirm packaging/slidemage.spec
      # Start every build once before it is published: --self-test imports every module the window needs and
      # exits 0. v8.33.0's Windows build stopped at startup (PyMuPDF 2.0 wanted model files the bundle lacked)
      # and was published anyway; a build like that fails here instead.
      - name: Self-test the folder (Linux)
        if: runner.os != 'Windows'
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/SlideMage-folder/SlideMage --self-test
      - name: Self-test the folder (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $run = Start-Process -FilePath 'dist/SlideMage-folder/SlideMage.exe' -ArgumentList '--self-test' -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "SlideMage-folder --self-test exited with $($run.ExitCode)" }
          # The Claude Code terminal's programs start through these; up to v8.58.0 they were missing.
          foreach ($helper in 'OpenConsole.exe', 'winpty-agent.exe') {
            if (-not (Get-ChildItem 'dist/SlideMage-folder' -Recurse -Filter $helper)) { throw "$helper is not in the build" }
          }
      # A zip with one top-level folder, which the updater of a folder installation unpacks.
      - name: Package the folder
        run: |
          python -c "import os, shutil; os.makedirs('out', exist_ok=True); shutil.make_archive('out/${{ matrix.asset_name }}-folder', 'zip', 'dist', 'SlideMage-folder')"
      - name: Attach the folder to the release
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ matrix.asset_name }}-folder.zip
          fail_on_unmatched_files: true
          body_path: release_notes.md
          # release_notes.py writes the changelog link itself, under a
          # heading of its own -- GitHub's appended "Full Changelog" line
          # would otherwise sit inside a "## Breaking changes" section
          generate_release_notes: false

      - name: Build the single file
        env:
          SLIDEMAGE_BUILD: onefile
        run: pyinstaller --noconfirm packaging/slidemage.spec
      - name: Self-test the single file (Linux)
        if: runner.os != 'Windows'
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/SlideMage --self-test
      - name: Self-test the single file (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $run = Start-Process -FilePath 'dist/SlideMage.exe' -ArgumentList '--self-test' -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "SlideMage.exe --self-test exited with $($run.ExitCode)" }

      # PyInstaller produces one file (dist/SlideMage[.exe]) -- zipped so
      # the executable bit survives the upload/download round trip, and
      # so every platform's asset has the same shape. `zip` isn't
      # reliably on PATH on windows-latest, so this branches by OS rather
      # than assuming a shared shell tool.
      #
      # Linux only, also bundles icon.svg and the .desktop template: unlike
      # Windows/macOS, PyInstaller doesn't embed an icon into a Linux ELF
      # binary at all (a GNOME/KDE launcher icon instead comes from a
      # .desktop file's own Icon= line) -- without these two alongside the
      # binary, setting up a desktop entry from just the downloaded zip has
      # no icon file to point at, only the source repo's own copy (which a
      # user who only ever downloads releases may not have on disk at all).
      - name: Package the single file (Linux)
        if: runner.os != 'Windows'
        run: |
          zip -j "out/${{ matrix.asset_name }}.zip"             "${{ matrix.binary_path }}"             src/slidemage/assets/icon.svg             packaging/slidemage.desktop.template
      - name: Package the single file (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "${{ matrix.binary_path }}" -DestinationPath "out/${{ matrix.asset_name }}.zip"
      - name: Attach the single file to the release
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ matrix.asset_name }}.zip
          fail_on_unmatched_files: true
          body_path: release_notes.md
          generate_release_notes: false
