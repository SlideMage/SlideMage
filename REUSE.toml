[[annotations]]
path = ["tests/fixtures/theme_package/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Stefan Palan, Jürgen Fleiß"
SPDX-License-Identifier = "LPPL-1.3c+"
