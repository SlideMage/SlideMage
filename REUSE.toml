precedence = "override"
SPDX-FileCopyrightText = "The hyph-utf8 authors, see latex/hyphenation/NOTICES.txt"
SPDX-License-Identifier = "LicenseRef-hyph-bg"

[[annotations]]
path = ["latex/hyphenation/hyph-eu.*.txt"]
precedence = "override"
SPDX-FileCopyrightText = "The hyph-utf8 authors, see latex/hyphenation/NOTICES.txt"
SPDX-License-Identifier = "LicenseRef-hyph-eu"

[[annotations]]
path = ["latex/hyphenation/hyph-fi.*.txt"]
precedence = "override"
SPDX-FileCopyrightText = "The hyph-utf8 authors, see latex/hyphenation/NOTICES.txt"
SPDX-License-Identifier = "LicenseRef-hyph-fi"

[[annotations]]
path = ["latex/hyphenation/hyph-nb.*.txt"]
precedence = "override"
SPDX-FileCopyrightText = "The hyph-utf8 authors, see latex/hyphenation/NOTICES.txt"
SPDX-License-Identifier = "LicenseRef-hyph-nb"

[[annotations]]
path = ["latex/hyphenation/NOTICES.txt"]
precedence = "override"
SPDX-FileCopyrightText = "The hyph-utf8 authors"
SPDX-License-Identifier = "MIT AND LPPL-1.3c+ AND GPL-2.0-or-later AND GPL-2.0-only AND BSD-3-Clause AND Unlicense AND LicenseRef-hyph-bg AND LicenseRef-hyph-eu AND LicenseRef-hyph-fi AND LicenseRef-hyph-nb"

# Documentation and the example project.
[[annotations]]
path = ["README.md", "docs/**", "example/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Stefan Palan, Jürgen Fleiß"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# The images the stress-test project's calibration deck uses are the example project's own.
[[annotations]]
path = ["tests/fixtures/template_stress/media/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Stefan Palan, Jürgen Fleiß"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# The test template's logo is a copy of SlideMage's own logo (latex/slidemage-logo.pdf).
[[annotations]]
path = ["tests/fixtures/template_acme/schemes/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Stefan Palan, Jürgen Fleiß"
SPDX-License-Identifier = "LPPL-1.3c+"

# The licence texts themselves and this overview.
[[annotations]]
path = ["LICENSE", "THIRD_PARTY_NOTICES.md", "REUSE.toml", "LICENSES/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Stefan Palan, Jürgen Fleiß"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# The test theme package (tests/fixtures/theme_package/, docs/THEME_PACKAGE.md): its manifest, notes and licence
