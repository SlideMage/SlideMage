version = 1
SPDX-PackageName = "SlideMage"
SPDX-PackageSupplier = "Stefan Palan"
SPDX-PackageDownloadLocation = "https://github.com/SlideMage/SlideMage"

# Files that cannot carry an SPDX header of their own. Python, Lua and the
# SlideMage LaTeX files have one; see LICENSE for the overview.

[[annotations]]
path = ["pyproject.toml", "uv.lock", ".gitattributes", ".gitignore", ".github/**", ".claude/**",
        "packaging/**", "tools/**", "tests/**", "src/slidemage/CHANGELOG.md",
        "src/slidemage/assets/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Stefan Palan, Jürgen Fleiß"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The bundled fonts keep their own licences (src/slidemage/assets/fonts/README.md).
[[annotations]]
path = ["src/slidemage/assets/fonts/Roboto*.ttf", "src/slidemage/assets/fonts/LICENSE-Roboto*.txt"]
precedence = "override"
SPDX-FileCopyrightText = "The Roboto Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["src/slidemage/assets/fonts/MaterialIcons-Regular.ttf", "src/slidemage/assets/fonts/LICENSE-MaterialIcons-Apache-2.0.txt"]
precedence = "override"
SPDX-FileCopyrightText = "Google LLC"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["src/slidemage/assets/fonts/README.md"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Stefan Palan, Jürgen Fleiß"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# The LaTeX framework: our logo files (the preamble and Lua files have headers).
[[annotations]]
path = ["latex/slidemage-logo.pdf", "latex/slidemage-logo.svg", "latex/LICENSE"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Stefan Palan, Jürgen Fleiß"
SPDX-License-Identifier = "LPPL-1.3c+"

# The SlideMage beamer theme: a modified version of Romain Noël's Gotham theme (LPPL 1.3c), under the same licence.
[[annotations]]
path = ["latex/beamerthemeSlideMage.sty"]
precedence = "override"
SPDX-FileCopyrightText = ["2023-2026 Romain Noël <romainoel@free.fr>", "2026 Stefan Palan, Jürgen Fleiß"]
SPDX-License-Identifier = "LPPL-1.3c"

# The hyphenation patterns (v0.13.37): hyph-utf8's files, each under one of its own licences
# (tools/fetch_hyphenation_patterns.py); every file's copyright and original notice is in NOTICES.txt.
[[annotations]]
path = ["latex/hyphenation/hyph-de-1996.*.txt", "latex/hyphenation/hyph-fr.*.txt", "latex/hyphenation/hyph-es.*.txt",
        "latex/hyphenation/hyph-nl.*.txt", "latex/hyphenation/hyph-lt.*.txt", "latex/hyphenation/hyph-da.*.txt",
        "latex/hyphenation/hyph-el-monoton.*.txt", "latex/hyphenation/hyph-it.*.txt",
        "latex/hyphenation/hyph-sl.*.txt", "latex/hyphenation/hyph-uk.*.txt", "latex/hyphenation/hyph-pl.*.txt",
        "latex/hyphenation/hyph-ga.*.txt", "latex/hyphenation/hyph-hi.*.txt", "latex/hyphenation/hyph-et.*.txt"]
precedence = "override"
SPDX-FileCopyrightText = "The hyph-utf8 authors, see latex/hyphenation/NOTICES.txt"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["latex/hyphenation/hyph-ca.*.txt", "latex/hyphenation/hyph-hr.*.txt", "latex/hyphenation/hyph-sh-cyrl.*.txt",
        "latex/hyphenation/hyph-tr.*.txt", "latex/hyphenation/hyph-ru.*.txt", "latex/hyphenation/hyph-sv.*.txt",
        "latex/hyphenation/hyph-is.*.txt", "latex/hyphenation/hyph-th.*.txt"]
precedence = "override"
SPDX-FileCopyrightText = "The hyph-utf8 authors, see latex/hyphenation/NOTICES.txt"
