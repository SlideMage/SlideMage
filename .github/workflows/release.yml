name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: SlideMage-linux
            binary_path: dist/SlideMage
          - os: windows-latest
            asset_name: SlideMage-windows
            binary_path: dist/SlideMage.exe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # release_notes.py needs the previous tag
      # Info -> "Check for updates…" compares the release tag with the
      # running build's VERSION_NUMBER, so the two must be the same.
      - name: Tag matches VERSION_NUMBER
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected=$(sed -n 's/^VERSION_NUMBER = "\(v[^"]*\)".*/\1/p' src/slidemage/version.py)
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match VERSION_NUMBER $expected"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: pip install -e ".[build]"
      # The release notes are this version's history entry in version.py.
      # Fails the release when the major number goes up without a
      # "BREAKING:" paragraph there -- the updater relies on that marker to
      # ask before installing a release that breaks with the past.
      - name: Release notes
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            tag=$(sed -n 's/^VERSION_NUMBER = "\(v[^"]*\)".*/\1/p' src/slidemage/version.py)
          fi
          python packaging/release_notes.py "$tag" > release_notes.md
      - run: pyinstaller packaging/slidemage.spec

      # PyInstaller produces one file (dist/SlideMage[.exe]) -- zipped so
      # the executable bit survives the upload/download round trip, and
      # so every platform's asset has the same shape. `zip` isn't
      # reliably on PATH on windows-latest, so this branches by OS rather
      # than assuming a shared shell tool.
      #
      # Linux only, also bundles icon.svg and the .desktop template: unlike
      # Windows/macOS, PyInstaller doesn't embed an icon into a Linux ELF
      # binary at all (a GNOME/KDE launcher icon instead comes from a
      # .desktop file's own Icon= line) -- without these two alongside the
      # binary, setting up a desktop entry from just the downloaded zip has
      # no icon file to point at, only the source repo's own copy (which a
      # user who only ever downloads releases may not have on disk at all).
      - name: Package (Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir -p out
          zip -j "out/${{ matrix.asset_name }}.zip" \
            "${{ matrix.binary_path }}" \
            src/slidemage/assets/icon.svg \
            packaging/slidemage.desktop.template
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path "${{ matrix.binary_path }}" -DestinationPath "out/${{ matrix.asset_name }}.zip"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ matrix.asset_name }}.zip
          fail_on_unmatched_files: true
          body_path: release_notes.md
          # release_notes.py writes the changelog link itself, under a
          # heading of its own -- GitHub's appended "Full Changelog" line
          # would otherwise sit inside a "## Breaking changes" section
          generate_release_notes: false
